[project]
site_name = "SQS Entity Resolution Using Senzing"
repo_url = "https://github.com/codeforamerica/sqs-entity-resolution"
edit_uri = "edit/main/docs/"
copyright = "Produced by Code for America under the MIT license."

nav = [
  "index.md",
  "configuration.md",
  "development.md",
  "future.md",
  "security.md",
  { "Architecture" = [
      "architecture/index.md",
      "architecture/consumer.md",
      "architecture/database.md",
      "architecture/exporter.md",
      "architecture/queues.md",
      "architecture/redoer.md",
      "architecture/scaling.md",
      "architecture/tools.md",
      { "Infrastructure" = [
          "architecture/infrastructure/index.md",
          "architecture/infrastructure/dashboards.md",
          "architecture/infrastructure/foundation.md",
          "architecture/infrastructure/networking.md",
          "architecture/infrastructure/service.md",
        ]
      },
    ]
  },
  { "Middleware" = [
      "middleware/index.md",
      "middleware/consumer.md",
      "middleware/exporter.md",
      "middleware/redoer.md",
    ]
  },
  { "Operations" = [
      "operations/index.md",
      "operations/deploying.md",
      "operations/export.md",
      "operations/launching.md",
      "operations/monitoring.md",
      "operations/scaling.md",
      "operations/tools.md",
    ]
  }
]

[project.theme]
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.path",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
  "toc.integrate",
]

[project.theme.icon]
logo = "fontawesome/solid/reorder"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false

[[project.extra.social]]
icon = "material/web"
link = "https://codeforamerica.org/"
name = "Code for America website"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/codeforamerica"
name = "Code for America on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/threads"
link = "https://www.threads.net/@codeforamerica"
name = "Code for America on Threads"

[[project.extra.social]]
icon = "fontawesome/brands/bluesky"
link = "https://bsky.app/profile/codeforamerica.org"
name = "Code for America on Bluesky"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.github-callouts]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.mdx_truly_sane_lists]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
